    url: https://github.com/Shopify/app-intent-types/discussions/categories/help
    about: Stuck on shopify.extension.toml or your inputSchema? Ask in Discussions.
  - name: Report a Sidekick bug
    url: https://community.shopify.com/c/shopify-apps/ct-p/shopify-apps
    about: Bugs in Sidekick or your extension's runtime behavior belong in the Shopify Community forum, not here.
